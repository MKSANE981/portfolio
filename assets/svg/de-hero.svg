<svg viewBox="0 0 480 420" xmlns="http://www.w3.org/2000/svg" width="480" height="420">
  <defs>
    <linearGradient id="pipeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Animated dash -->
    <style>
      .flow-line { stroke-dasharray: 6 4; animation: flowAnim 1.8s linear infinite; }
      @keyframes flowAnim { to { stroke-dashoffset: -20; } }
    </style>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="460" height="400" rx="20" fill="#022C22" opacity=".08" stroke="#059669" stroke-width=".5" stroke-opacity=".2"/>

  <!-- SOURCE BOXES (left column) -->
  <!-- PDF -->
  <rect x="24" y="55" width="76" height="42" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width=".8"/>
  <text x="62" y="72" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500" fill="#065F46">PDF</text>
  <text x="62" y="87" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="8" fill="#059669" opacity=".7">documents</text>

  <!-- Email -->
  <rect x="24" y="115" width="76" height="42" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width=".8"/>
  <text x="62" y="132" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500" fill="#065F46">Email</text>
  <text x="62" y="147" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="8" fill="#059669" opacity=".7">inbox</text>

  <!-- Excel -->
  <rect x="24" y="175" width="76" height="42" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width=".8"/>
  <text x="62" y="192" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500" fill="#065F46">Excel</text>
  <text x="62" y="207" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="8" fill="#059669" opacity=".7">tableaux</text>

  <!-- Image -->
  <rect x="24" y="235" width="76" height="42" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width=".8"/>
  <text x="62" y="252" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="11" font-weight="500" fill="#065F46">Image</text>
  <text x="62" y="267" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="8" fill="#059669" opacity=".7">scan / photo</text>

  <!-- Arrows to OCR block -->
  <line x1="100" y1="76"  x2="152" y2="130" stroke="#059669" stroke-width="1.2" stroke-opacity=".4" marker-end="url(#arr)" class="flow-line"/>
  <line x1="100" y1="136" x2="152" y2="140" stroke="#059669" stroke-width="1.2" stroke-opacity=".5" marker-end="url(#arr)" class="flow-line"/>
  <line x1="100" y1="196" x2="152" y2="155" stroke="#059669" stroke-width="1.2" stroke-opacity=".4" marker-end="url(#arr)" class="flow-line"/>
  <line x1="100" y1="256" x2="152" y2="168" stroke="#059669" stroke-width="1.2" stroke-opacity=".4" marker-end="url(#arr)" class="flow-line"/>

  <!-- OCR / Azure Doc Intelligence -->
  <rect x="155" y="108" width="100" height="72" rx="12" fill="#059669" opacity=".12" stroke="#059669" stroke-width="1.2"/>
  <text x="205" y="135" text-anchor="middle" font-family="'Syne', sans-serif" font-size="10" font-weight="700" fill="#059669">Azure Doc.</text>
  <text x="205" y="150" text-anchor="middle" font-family="'Syne', sans-serif" font-size="10" font-weight="700" fill="#059669">Intelligence</text>
  <text x="205" y="168" text-anchor="middle" font-family="'DM Mono', monospace" font-size="8" fill="#059669" opacity=".6">OCR + Extract</text>

  <!-- Arrow to Agents -->
  <line x1="256" y1="144" x2="286" y2="144" stroke="#059669" stroke-width="1.5" marker-end="url(#arr)" class="flow-line"/>

  <!-- Pydantic AI Agents -->
  <rect x="289" y="108" width="100" height="72" rx="12" fill="#059669" opacity=".12" stroke="#059669" stroke-width="1.2"/>
  <text x="339" y="135" text-anchor="middle" font-family="'Syne', sans-serif" font-size="10" font-weight="700" fill="#059669">Pydantic AI</text>
  <text x="339" y="150" text-anchor="middle" font-family="'Syne', sans-serif" font-size="10" font-weight="700" fill="#059669">Agents</text>
  <text x="339" y="168" text-anchor="middle" font-family="'DM Mono', monospace" font-size="8" fill="#059669" opacity=".6">struct + valid.</text>

  <!-- Arrow to storage -->
  <line x1="390" y1="144" x2="420" y2="144" stroke="#059669" stroke-width="1.5" marker-end="url(#arr)" class="flow-line"/>

  <!-- Azure Blob Storage -->
  <rect x="422" y="118" width="46" height="52" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width=".8"/>
  <text x="445" y="140" text-anchor="middle" font-family="'Syne', sans-serif" font-size="8" font-weight="700" fill="#065F46">Azure</text>
  <text x="445" y="153" text-anchor="middle" font-family="'Syne', sans-serif" font-size="8" font-weight="700" fill="#065F46">Blob</text>
  <text x="445" y="163" text-anchor="middle" font-family="'DM Mono', monospace" font-size="7" fill="#059669" opacity=".6">JSON</text>

  <!-- SECOND ROW - RAG Pipeline -->
  <line x1="339" y1="180" x2="339" y2="210" stroke="#059669" stroke-width="1.2" stroke-opacity=".5" marker-end="url(#arr)" class="flow-line"/>

  <!-- ChromaDB -->
  <rect x="155" y="214" width="100" height="60" rx="12" fill="#059669" opacity=".12" stroke="#059669" stroke-width="1.2"/>
  <text x="205" y="238" text-anchor="middle" font-family="'Syne', sans-serif" font-size="10" font-weight="700" fill="#059669">ChromaDB</text>
  <text x="205" y="254" text-anchor="middle" font-family="'DM Mono', monospace" font-size="8" fill="#059669" opacity=".6">Vector Store</text>
  <text x="205" y="267" text-anchor="middle" font-family="'DM Mono', monospace" font-size="7" fill="#059669" opacity=".5">+ OpenAI embed.</text>

  <!-- Arrow from agents to ChromaDB -->
  <line x1="339" y1="214" x2="256" y2="244" stroke="#059669" stroke-width="1.2" stroke-opacity=".4" marker-end="url(#arr)" class="flow-line"/>

  <!-- Ray Orchestration -->
  <rect x="289" y="214" width="100" height="60" rx="12" fill="#059669" opacity=".12" stroke="#059669" stroke-width="1.2"/>
  <text x="339" y="238" text-anchor="middle" font-family="'Syne', sans-serif" font-size="10" font-weight="700" fill="#059669">Ray / Ray</text>
  <text x="339" y="253" text-anchor="middle" font-family="'Syne', sans-serif" font-size="10" font-weight="700" fill="#059669">Serve</text>
  <text x="339" y="267" text-anchor="middle" font-family="'DM Mono', monospace" font-size="8" fill="#059669" opacity=".6">orchestration</text>

  <!-- FastAPI -->
  <rect x="422" y="214" width="46" height="60" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width=".8"/>
  <text x="445" y="238" text-anchor="middle" font-family="'Syne', sans-serif" font-size="8" font-weight="700" fill="#065F46">Fast</text>
  <text x="445" y="251" text-anchor="middle" font-family="'Syne', sans-serif" font-size="8" font-weight="700" fill="#065F46">API</text>
  <text x="445" y="265" text-anchor="middle" font-family="'DM Mono', monospace" font-size="7" fill="#059669" opacity=".6">REST</text>

  <line x1="390" y1="244" x2="420" y2="244" stroke="#059669" stroke-width="1.2" stroke-opacity=".5" marker-end="url(#arr)" class="flow-line"/>

  <!-- Metrics row -->
  <rect x="32" y="305" width="96" height="52" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width=".8"/>
  <text x="80" y="326" text-anchor="middle" font-family="'Syne', sans-serif" font-size="18" font-weight="800" fill="#059669">80%</text>
  <text x="80" y="346" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="9" fill="#065F46">Automatisé</text>

  <rect x="146" y="305" width="96" height="52" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width=".8"/>
  <text x="194" y="326" text-anchor="middle" font-family="'Syne', sans-serif" font-size="18" font-weight="800" fill="#059669">&lt;1h</text>
  <text x="194" y="346" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="9" fill="#065F46">vs 1 semaine</text>

  <rect x="260" y="305" width="96" height="52" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width=".8"/>
  <text x="308" y="326" text-anchor="middle" font-family="'Syne', sans-serif" font-size="18" font-weight="800" fill="#059669">+30%</text>
  <text x="308" y="346" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="9" fill="#065F46">Efficacité ANSD</text>

  <rect x="374" y="305" width="96" height="52" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width=".8"/>
  <text x="422" y="326" text-anchor="middle" font-family="'Syne', sans-serif" font-size="18" font-weight="800" fill="#059669">RGPD</text>
  <text x="422" y="346" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="9" fill="#065F46">Conforme</text>

  <!-- Docker / CI-CD label -->
  <rect x="155" y="375" width="258" height="32" rx="8" fill="#059669" opacity=".1" stroke="#059669" stroke-width=".6" stroke-opacity=".4"/>
  <text x="284" y="396" text-anchor="middle" font-family="'DM Mono', monospace" font-size="10" fill="#059669" font-weight="500">Docker · CI/CD · Logfire monitoring</text>
</svg>
