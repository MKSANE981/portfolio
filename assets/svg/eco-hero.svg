<svg viewBox="0 0 480 420" xmlns="http://www.w3.org/2000/svg" width="480" height="420">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E8A9E" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#0D4C57" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E8A9E"/>
      <stop offset="100%" stop-color="#C8963E"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background card -->
  <rect x="10" y="10" width="460" height="400" rx="20" fill="#FFFFFF" opacity=".06" stroke="#0E8A9E" stroke-width=".5" stroke-opacity=".3"/>

  <!-- Chart area bg -->
  <rect x="40" y="40" width="400" height="240" rx="10" fill="#0D4C57" opacity=".08"/>

  <!-- Grid lines -->
  <line x1="40" y1="100" x2="440" y2="100" stroke="#0E8A9E" stroke-width=".4" stroke-opacity=".2" stroke-dasharray="4 4"/>
  <line x1="40" y1="150" x2="440" y2="150" stroke="#0E8A9E" stroke-width=".4" stroke-opacity=".2" stroke-dasharray="4 4"/>
  <line x1="40" y1="200" x2="440" y2="200" stroke="#0E8A9E" stroke-width=".4" stroke-opacity=".2" stroke-dasharray="4 4"/>
  <line x1="40" y1="250" x2="440" y2="250" stroke="#0E8A9E" stroke-width=".4" stroke-opacity=".2" stroke-dasharray="4 4"/>

  <!-- Bars -->
  <rect x="60"  y="180" width="36" height="100" rx="4" fill="url(#barGrad)" opacity=".7"/>
  <rect x="120" y="155" width="36" height="125" rx="4" fill="url(#barGrad)" opacity=".8"/>
  <rect x="180" y="120" width="36" height="160" rx="4" fill="url(#barGrad)"/>
  <rect x="240" y="100" width="36" height="180" rx="4" fill="url(#barGrad)"/>
  <rect x="300" y="130" width="36" height="150" rx="4" fill="url(#barGrad)" opacity=".85"/>
  <rect x="360" y="90"  width="36" height="190" rx="4" fill="url(#barGrad)"/>

  <!-- Trend line -->
  <polyline points="78,175 138,150 198,115 258,96 318,128 378,86"
    fill="none" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Data points -->
  <circle cx="78"  cy="175" r="4.5" fill="#0E8A9E" filter="url(#glow)"/>
  <circle cx="138" cy="150" r="4.5" fill="#0E8A9E" filter="url(#glow)"/>
  <circle cx="198" cy="115" r="4.5" fill="#0E8A9E" filter="url(#glow)"/>
  <circle cx="258" cy="96"  r="5.5" fill="#C8963E" filter="url(#glow)"/>
  <circle cx="318" cy="128" r="4.5" fill="#0E8A9E" filter="url(#glow)"/>
  <circle cx="378" cy="86"  r="5.5" fill="#C8963E" filter="url(#glow)"/>

  <!-- Callout box -->
  <rect x="290" y="55" width="130" height="54" rx="8" fill="#0E8A9E" opacity=".12" stroke="#0E8A9E" stroke-width=".8" stroke-opacity=".4"/>
  <text x="355" y="77" text-anchor="middle" font-family="'DM Mono', monospace" font-size="18" font-weight="700" fill="#0E8A9E">+12.4%</text>
  <text x="355" y="97" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="10" fill="#0E8A9E" opacity=".7">Elasticité revenu</text>
  <line x1="290" y1="82" x2="258" y2="96" stroke="#0E8A9E" stroke-width=".8" stroke-dasharray="3 2" stroke-opacity=".5"/>

  <!-- X-axis labels -->
  <text x="78"  y="298" text-anchor="middle" font-family="'DM Mono', monospace" font-size="9" fill="#0D4C57" opacity=".6">Q1</text>
  <text x="138" y="298" text-anchor="middle" font-family="'DM Mono', monospace" font-size="9" fill="#0D4C57" opacity=".6">Q2</text>
  <text x="198" y="298" text-anchor="middle" font-family="'DM Mono', monospace" font-size="9" fill="#0D4C57" opacity=".6">Q3</text>
  <text x="258" y="298" text-anchor="middle" font-family="'DM Mono', monospace" font-size="9" fill="#0D4C57" opacity=".6">Q4</text>
  <text x="318" y="298" text-anchor="middle" font-family="'DM Mono', monospace" font-size="9" fill="#0D4C57" opacity=".6">Q5</text>
  <text x="378" y="298" text-anchor="middle" font-family="'DM Mono', monospace" font-size="9" fill="#0D4C57" opacity=".6">Q6</text>

  <!-- Bottom stats row -->
  <rect x="40" y="320" width="120" height="68" rx="10" fill="#E1F5EE" stroke="#9FE1CB" stroke-width=".8"/>
  <text x="100" y="348" text-anchor="middle" font-family="'Syne', sans-serif" font-size="22" font-weight="800" fill="#0E8A9E">86.4%</text>
  <text x="100" y="368" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="9" fill="#085041">Précision modèle</text>

  <rect x="180" y="320" width="120" height="68" rx="10" fill="#E1F5EE" stroke="#9FE1CB" stroke-width=".8"/>
  <text x="240" y="348" text-anchor="middle" font-family="'Syne', sans-serif" font-size="22" font-weight="800" fill="#0E8A9E">EHCVM</text>
  <text x="240" y="368" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="9" fill="#085041">2018 — 2022</text>

  <rect x="320" y="320" width="120" height="68" rx="10" fill="#E1F5EE" stroke="#9FE1CB" stroke-width=".8"/>
  <text x="380" y="348" text-anchor="middle" font-family="'Syne', sans-serif" font-size="22" font-weight="800" fill="#0E8A9E">4 ans</text>
  <text x="380" y="368" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="9" fill="#085041">Expérience</text>
</svg>
